name: dump-markets

# Manually dump normalized markets from both venues to the `fixtures` branch,
# for offline matcher evaluation.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dump -- --out fixtures-out
      - name: Publish to fixtures branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          gzip -9 fixtures-out/markets.json
          git worktree add --detach fixtures-branch
          cd fixtures-branch
          git checkout --orphan fixtures
          git rm -rf . >/dev/null 2>&1 || true
          cp ../fixtures-out/markets.json.gz .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add markets.json.gz
          git commit -m "market dump $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" fixtures
