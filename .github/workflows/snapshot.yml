name: snapshot

# Scan both venues every 30 minutes and append the result to the `data` branch.
# The dashboard's Persistence page reads analysis.json from that branch.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Don't leave a write token in .git/config while dependencies install.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check out data branch
        run: |
          if git ls-remote --exit-code origin refs/heads/data >/dev/null; then
            git fetch --depth=1 origin data:data
            git worktree add data-branch data
          else
            git worktree add --detach data-branch
            cd data-branch
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
            echo "Scan snapshots written by .github/workflows/snapshot.yml" > README.md
          fi
          # Data-only branch: tell Vercel not to try building it on every push.
          [ -f data-branch/vercel.json ] || echo '{"git":{"deploymentEnabled":false}}' > data-branch/vercel.json

      - name: Scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run snapshot -- --out data-branch/snapshots

      # Commit the raw snapshot first so a later failure can't lose it.
      - name: Commit snapshot
        run: |
          cd data-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"

      - name: Analyze persistence
        continue-on-error: true
        run: |
          npm run analyze -- --dir data-branch/snapshots --out data-branch/analysis.json
          cd data-branch
          git add analysis.json
          git commit -q --amend --no-edit || true

      - name: Push
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd data-branch
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git push "$remote" HEAD:data; then exit 0; fi
            echo "push rejected; rebasing onto the latest data branch (attempt $attempt)"
            git fetch --depth=20 "$remote" data
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
          done
          exit 1
