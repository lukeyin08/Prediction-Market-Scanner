name: snapshot

# Scan both venues every 30 minutes and append the result to the `data` branch.
# The dashboard's Persistence page reads analysis.json from that branch.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check out data branch
        run: |
          git fetch origin data:data 2>/dev/null || true
          if git show-ref --verify --quiet refs/heads/data; then
            git worktree add data-branch data
          else
            git worktree add --detach data-branch
            cd data-branch
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
            echo "Scan snapshots written by .github/workflows/snapshot.yml" > README.md
          fi

      - name: Scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run snapshot -- --out data-branch/snapshots

      - name: Analyze persistence
        run: npm run analyze -- --dir data-branch/snapshots --out data-branch/analysis.json

      - name: Commit snapshot
        run: |
          cd data-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push origin data
